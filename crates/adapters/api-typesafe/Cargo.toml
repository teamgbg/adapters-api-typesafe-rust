[package]
name = "api-typesafe"
version = "0.1.4"
edition = "2021"
publish = ["teamscala"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[package.metadata.teamscala]
capability = "Typed rest_client adapter for the TypeSafe AI API (Rust) — POST /v1/systemone, GET /v1/models."
tier = "adapters"
